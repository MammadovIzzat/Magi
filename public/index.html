<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Magi</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13.5' stroke='%23FFB000' stroke-width='1.6' fill='none'/><rect x='7.5' y='7.5' width='17' height='17' stroke='%23FFB000' stroke-width='1.6' fill='none'/><rect x='7.5' y='7.5' width='17' height='17' stroke='%23FFB000' stroke-width='1.6' fill='none' transform='rotate(45 16 16)'/></svg>" />
</head>
<body>
  <div class="app">
    <header class="topbar" id="topbar" hidden>
      <button class="brand" id="homeBtn" title="Engagements">
        <svg viewBox="0 0 32 32" width="20" height="20" fill="none">
          <circle cx="16" cy="16" r="13.5" stroke="#FFB000" stroke-width="1.4"/>
          <rect x="7.5" y="7.5" width="17" height="17" stroke="#FFB000" stroke-width="1.4"/>
          <rect x="7.5" y="7.5" width="17" height="17" stroke="#FFB000" stroke-width="1.4" transform="rotate(45 16 16)"/>
          <circle cx="16" cy="16" r="2.2" fill="#FFB000"/>
        </svg>
        <span class="brand-name">MAGI</span>
      </button>
      <button class="backbtn" id="backBtn" title="Back" hidden>
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg>
        <span class="lbl">Back</span>
      </button>
      <div class="vrule"></div>
      <nav class="crumbs" id="crumbs"></nav>
      <div class="spacer"></div>
      <div id="topActions" style="display:flex;gap:7px"></div>
      <div id="account"></div>
    </header>
    <div class="shell">
      <aside class="rail" id="rail" hidden></aside>
      <main class="main" id="view"></main>
    </div>
  </div>
  <div id="modalRoot"></div>
  <script src="/qr.js"></script>
  <script src="/app.js"></script>
</body>
</html>
