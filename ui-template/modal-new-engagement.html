<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Magi — Dialog — new engagement</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'&gt;&lt;circle cx='16' cy='16' r='13.5' stroke='%23E8B65A' stroke-width='1.6' fill='none'/&gt;&lt;rect x='7.5' y='7.5' width='17' height='17' stroke='%23E8B65A' stroke-width='1.6' fill='none'/&gt;&lt;rect x='7.5' y='7.5' width='17' height='17' stroke='%23E8B65A' stroke-width='1.6' fill='none' transform='rotate(45 16 16)'/&gt;&lt;/svg&gt;">
</head>
<body>
  <div class="app">
    <header class="topbar" id="topbar">
      <button class="brand" id="homeBtn" title="Engagements">
        <svg viewBox="0 0 32 32" width="26" height="26" fill="none">
          <circle cx="16" cy="16" r="13.5" stroke="#E8B65A" stroke-width="1.3" opacity=".85"></circle>
          <rect x="7.5" y="7.5" width="17" height="17" stroke="#E8B65A" stroke-width="1.3"></rect>
          <rect x="7.5" y="7.5" width="17" height="17" stroke="#E8B65A" stroke-width="1.3" transform="rotate(45 16 16)"></rect>
          <circle cx="16" cy="16" r="2.4" fill="#E8B65A" opacity=".55"></circle>
          <circle cx="16" cy="2.5" r="2.5" fill="#3D6FF0"></circle>
          <circle cx="16" cy="29.5" r="2.5" fill="#E2453C"></circle>
        </svg>
        <span class="brand-name">MAGI</span>
      </button>
      <button class="backbtn" id="backBtn" title="Back" hidden="">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"></path></svg>
        <span class="lbl">Back</span>
      </button>
      <div class="vrule"></div>
      <nav class="crumbs" id="crumbs"><span class="sep">/</span><span class="cur">engagements</span></nav>
      <div class="spacer"></div>
      <div id="topActions" style="display:flex;gap:7px"></div>
      <button id="tplBtn" class="btn" title="Checklist templates"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h12M2 8h8M2 12h5"></path></svg><span class="lbl">Templates</span></button><div id="account"><div class="acct"><button class="linkbadge" title="Working locally — click to connect to a team server"><span class="dot"></span><span class="lbl">local</span></button><div class="avatar">O</div><span class="who">operator</span><button class="iconbtn" title="Change username"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2.5l2.5 2.5L5.5 13H3v-2.5z"></path></svg></button><button class="iconbtn" title="Change password"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 2.5a3.5 3.5 0 100 7 3.5 3.5 0 000-7zM8 8l-5.5 5.5V15h2l4-4"></path></svg></button><button class="iconbtn danger" title="Sign out"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2H3v12h3M10 5l3 3-3 3M13 8H6"></path></svg></button></div></div>
    </header>
    <div class="shell">
      <aside class="rail" id="rail" hidden=""></aside>
      <main class="main" id="view"><div class="page"><div class="page-head"><div><div class="kicker">Workspace</div><h1>Engagements</h1></div><div style="display: flex; gap: 7px;"><button class="btn" title="Import an engagement from a file"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V5M4.5 8.5L8 5l3.5 3.5"></path></svg>Import</button><button class="btn gold"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v10M3 8h10"></path></svg>New engagement</button></div></div><div class="filters"><button class="filt on">Active<span>1</span></button><button class="filt">Finished<span>0</span></button></div><input class="searchbox" type="search" placeholder="Search 1 active engagement…"><div><div class="ptable"><div class="ptable-head kicker"><span>Engagement</span><span class="hide-sm">Client</span><span class="hide-sm">Coverage</span><span class="hide-sm">Dates</span><span></span></div><button class="prow"><span style="display: flex; align-items: center; gap: 12px; min-width: 0px;"><span class="pdot part"></span><span style="display: flex; flex-direction: column; gap: 3px; min-width: 0px;"><span class="pname">Acme Corp — External Assessment</span><span class="pmeta">7 targets · 7 findings</span></span></span><span class="pcell hide-sm">Acme Corporation</span><span class="hide-sm" style="display: flex; align-items: center; gap: 10px;"><span class="bar"><span style="width: 2%;"></span></span><span class="pct some">2%</span></span><span class="pcell hide-sm">Sep 1, 2026 → Sep 12, 2026</span><button class="ibtn del" title="Delete engagement"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.7 8.5h5.6l.7-8.5"></path></svg></button></button><div class="end"></div></div></div></div></main>
    </div>
  </div>
  <div id="modalRoot"><div class="overlay"><form class="modal"><div class="modal-head"><span class="modal-kicker">Create</span><button type="button" class="modal-x" title="Close"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l8 8M12 4l-8 8"></path></svg></button></div><div class="modal-body"><h3>New engagement</h3><label>Engagement name</label><input name="name" type="text" placeholder="Acme Corp — Q4 External"><label>Client</label><input name="client" type="text" placeholder="Acme Corp"><label>Scope</label><input name="scope" type="text" placeholder="*.acme.com, 10.0.0.0/16"><div class="field-row"><div><label>Start date</label><input name="start_date" type="date" placeholder=""></div><div><label>End date</label><input name="end_date" type="date" placeholder=""></div></div><label>Notes</label><textarea name="notes" placeholder=""></textarea><div class="modal-err"></div></div><div class="actions"><button type="button" class="btn">Cancel</button><button type="submit" class="btn gold">Create</button></div></form></div></div>
  </body></html>
