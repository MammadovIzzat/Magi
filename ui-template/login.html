<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Magi — Sign-in (lock screen)</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'&gt;&lt;circle cx='16' cy='16' r='13.5' stroke='%23E8B65A' stroke-width='1.6' fill='none'/&gt;&lt;rect x='7.5' y='7.5' width='17' height='17' stroke='%23E8B65A' stroke-width='1.6' fill='none'/&gt;&lt;rect x='7.5' y='7.5' width='17' height='17' stroke='%23E8B65A' stroke-width='1.6' fill='none' transform='rotate(45 16 16)'/&gt;&lt;/svg&gt;">
</head>
<body>
  <div class="app">
    <header class="topbar" id="topbar" hidden="">
      <button class="brand" id="homeBtn" title="Engagements">
        <svg viewBox="0 0 32 32" width="26" height="26" fill="none">
          <circle cx="16" cy="16" r="13.5" stroke="#E8B65A" stroke-width="1.3" opacity=".85"></circle>
          <rect x="7.5" y="7.5" width="17" height="17" stroke="#E8B65A" stroke-width="1.3"></rect>
          <rect x="7.5" y="7.5" width="17" height="17" stroke="#E8B65A" stroke-width="1.3" transform="rotate(45 16 16)"></rect>
          <circle cx="16" cy="16" r="2.4" fill="#E8B65A" opacity=".55"></circle>
          <circle cx="16" cy="2.5" r="2.5" fill="#3D6FF0"></circle>
          <circle cx="16" cy="29.5" r="2.5" fill="#E2453C"></circle>
        </svg>
        <span class="brand-name">MAGI</span>
      </button>
      <button class="backbtn" id="backBtn" title="Back" hidden="">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"></path></svg>
        <span class="lbl">Back</span>
      </button>
      <div class="vrule"></div>
      <nav class="crumbs" id="crumbs"></nav>
      <div class="spacer"></div>
      <div id="topActions" style="display:flex;gap:7px"></div>
      <button id="tplBtn" class="btn" title="Checklist templates"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h12M2 8h8M2 12h5"></path></svg><span class="lbl">Templates</span></button><div id="account"></div>
    </header>
    <div class="shell">
      <aside class="rail" id="rail" hidden=""></aside>
      <main class="main" id="view"><div class="login-wrap"><form class="login-box"><div class="login-mark"><svg viewBox="0 0 32 32" width="72" height="72" fill="none"><circle cx="16" cy="16" r="13.5" stroke="#E8B65A" stroke-width=".9" opacity=".8"></circle>
    <circle cx="16" cy="16" r="10.6" stroke="#E8B65A" stroke-width=".4" opacity=".3"></circle>
    <rect x="7.5" y="7.5" width="17" height="17" stroke="#E8B65A" stroke-width=".9"></rect>
    <rect x="7.5" y="7.5" width="17" height="17" stroke="#E8B65A" stroke-width=".9" transform="rotate(45 16 16)"></rect>
    <circle cx="16" cy="16" r="2.2" fill="#E8B65A" opacity=".6"></circle>
    <circle cx="16" cy="2.5" r="2.5" fill="#3D6FF0"></circle>
    <circle cx="16" cy="29.5" r="2.5" fill="#E2453C"></circle></svg><div><div class="login-name">MAGI</div><div class="login-tag">The pentester's familiar</div></div></div><div class="login-card"><label>Operator</label><input name="username" placeholder="admin" autocomplete="username"><label>Passphrase</label><input name="password" type="password" autocomplete="current-password"><div class="loginerr"></div><button class="btn gold" type="submit">Authenticate</button><div class="login-hint"></div></div></form></div></main>
    </div>
  </div>
  <div id="modalRoot"></div>
  </body></html>
